# Example evaluation manifest for `station-watch evaluate` (K13).
#
# Labels are text and committed here, under measurements/labels/. The clips they
# point at stay LOCAL and gitignored under data/local/clips/ (never committed) --
# `--clips-dir` (default data/local/clips) is what each `path` below is relative to.
#
# Run a real evaluation with:
#   station-watch evaluate --config config/station.yaml \
#       --manifest measurements/labels/example-manifest.yaml \
#       --clips-dir data/local/clips --out measurements/line-3
#
# Clips are grouped BY RECORDING SESSION so a train / test split is always by
# session, never by adjacent frames (which would leak). See the full format in
# src/station_watch/evaluate/manifest.py. For a committed, runnable proving set
# see measurements/synthetic/manifest.yaml (generated by `evaluate --synthetic`).

dataset: line-3-example
sessions:
  - id: session-a
    clips:
      - path: session-a/clip-01.mkv
        # Rail-position state over a frame span: present | absent | unknown
        # (not_seated reads as absent; a covered part reads unknown).
        positions:
          - {target: rail_pos_1, state: present, start_frame: 0, end_frame: 300}
          - {target: rail_pos_2, state: absent, start_frame: 0, end_frame: 300}
      - path: session-a/clip-02.mkv
        positions:
          - {target: rail_pos_1, state: present, start_frame: 0, end_frame: 240}
          - {target: rail_pos_2, state: present, start_frame: 0, end_frame: 240}
        # A station-zone stall interval (no_motion past the window).
        stalls:
          - {start_frame: 120, end_frame: 240}
  - id: session-b
    clips:
      - path: session-b/clip-01.mkv
        positions:
          - {target: rail_pos_1, state: present, start_frame: 0, end_frame: 180}
          - {target: rail_pos_2, state: present, start_frame: 0, end_frame: 180}
        # A person inside a keep-out zone.
        keepouts:
          - {zone: zone_press, start_frame: 60, end_frame: 90}
        # An injected camera fault, with the frame it starts at.
        camera_faults:
          - {reason: dark, start_frame: 150}
